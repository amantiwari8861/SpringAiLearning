spring.application.name=SpringAiIntro
server.port=9090

logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# GEMINI API
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.7-flash
# Between 0 to 1.
# higher number -> more creative and random
# lower number -> more deterministic
# gpt-5 supports temperature=1 only
spring.ai.google.genai.chat.temperature=0.7

# OpenAI API
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5.6-luna

# Ollama server
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3.5:latest
spring.ai.ollama.chat.temperature=0.7
spring.ai.ollama.embedding.model=nomic-embed-text:latest

spring.datasource.url=jdbc:mysql://localhost:3306/ai_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234

spring.ai.chat.memory.repository.jdbc.initialize-schema=always